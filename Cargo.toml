[package]
name = "mcp-nap"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Keeps stdio MCP servers asleep until a tool is called"
license = "MIT"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
dirs = "7"
process-wrap = { version = "10", default-features = false, features = ["tokio1", "process-group", "kill-on-drop", "job-object"] }
rmcp = { version = "3.11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1.54", features = ["rt", "macros", "io-std", "io-util", "process", "signal", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

[dev-dependencies]
escargot = "1.0.1"
rmcp = { version = "3.11", default-features = false, features = ["client", "server", "transport-child-process", "transport-io"] }
tempfile = "3.27"
